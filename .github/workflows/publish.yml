# Публикация vless-setup в npm без токена и без кода 2FA.
# npm доверяет именно этому сценарию этого репозитория (Trusted Publishing, OIDC).
# Разрешение выдаётся один раз на npmjs.com: страница пакета vless-setup → Settings →
# Trusted Publisher → GitHub Actions, репозиторий IBR-new/vless, файл workflow publish.yml.
#
# Выпуск — git-метка вида vX.Y.Z (например v1.6.2). Версия в метке обязана
# совпадать с version в package.json, иначе публикации не будет.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # без него npm не выдаст одноразовый ключ публикации
  contents: read

concurrency: publish-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Сверка версии с меткой
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./package.json').version")
          if [ "$tag" != "$have" ]; then
            echo "::error::Метка $GITHUB_REF_NAME не совпадает с package.json ($have)"; exit 1
          fi
          echo "### vless-setup@$have → npm" >> "$GITHUB_STEP_SUMMARY"

      - name: npm, который умеет доверенную публикацию
        run: npm install -g npm@latest && npm -v

      - name: Тесты, если есть
        run: npm test --if-present

      - name: Публикация
        env:
          NPM_CONFIG_LOGLEVEL: verbose   # строки oidc в журнале: выдал ли npm одноразовый ключ
        run: npm publish
